# Local-only overlay. Run with compose.yml; database and app cannot reach external networks.
services:
  db:
    networks: [mcp-local]
  migrate:
    networks: [mcp-local]
  app:
    environment:
      APP_URL: http://localhost:3000
      COOKIE_SECURE: 'false'
      ENABLE_DEMO: 'true'
      TRUST_PROXY: 'false'
      MCP_DEMO_ENABLED: 'true'
      MCP_TOKEN_ENCRYPTION_KEY: ${MCP_TOKEN_ENCRYPTION_KEY:?Set a private 64-character hex encryption key}
    networks: [mcp-local]
    ports: !reset []
  gateway:
    image: offerly-local
    command: [node, scripts/mcp-local-gateway.mjs]
    restart: unless-stopped
    ports: ['127.0.0.1:3000:3000']
    networks: [mcp-local, mcp-ingress]
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:3000/api/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 20s
      timeout: 7s
      retries: 3
networks:
  mcp-local:
    internal: true
  mcp-ingress: {}
